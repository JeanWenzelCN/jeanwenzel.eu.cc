# Cloudflare Workers 配置文件

name = "qa-system"
main = "src/index.js"
compatibility_date = "2024-01-01"

# KV 绑定配置
# 存放验证问题（question:<id> -> { question, answerHash, salt }）
[[kv_namespaces]]
binding = "KV"
id = "替换为你自己的 KV 命名空间 ID"
preview_id = "替换为你自己的预览 KV 命名空间 ID"

# 存放会话数据 + 登录限流计数
[[kv_namespaces]]
binding = "SESSION_STORE"
id = "替换为你自己的 KV 命名空间 ID"
preview_id = "替换为你自己的预览 KV 命名空间 ID"

# 注意：管理员密码不要写在这个文件里（这个文件通常会被提交到 Git）。
# 部署前请用下面的命令把密码作为加密 Secret 上传，不要在此处使用 [vars]：
#
#   wrangler secret put ADMIN_PASSWORD --env production
#   wrangler secret put ADMIN_PASSWORD --env staging
#
# 本地调试可以在项目根目录创建 .dev.vars 文件（并加入 .gitignore）：
#   ADMIN_PASSWORD=你的本地测试密码
